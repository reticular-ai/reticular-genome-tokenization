[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reticular-diploid-demo"
version = "0.1.0"
description = "Frozen diploid genomic tokenization and public synthetic-teacher experiments"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy==2.2.6", "pysam==0.23.3"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]
figures = ["matplotlib==3.10.7"]

[tool.setuptools.packages.find]
include = ["reticular_diploid*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
