name: CPU correctness
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tokenizer:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test]'
      - run: python -m pytest -q tests/test_frozen_diploid.py tests/test_release_bundle.py tests/test_motif_frequency.py tests/test_prepare_public_1000g.py tests/test_download_public_1000g.py
      - run: python examples/roundtrip.py
